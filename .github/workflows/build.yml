name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README.txt"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleFreeRelease assembleProRelease bundleFreeRelease bundleProRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-Free
          path: app/build/outputs/apk/free/release/app-free-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-Pro
          path: app/build/outputs/apk/pro/release/app-pro-release.apk
      # .aab files are what Google Play accepts for upload
      - uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-AAB
          path: |
            app/build/outputs/bundle/freeRelease/app-free-release.aab
            app/build/outputs/bundle/proRelease/app-pro-release.aab
