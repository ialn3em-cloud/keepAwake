name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README.txt"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease assembleUnlocked --no-daemon
      # the store listing and privacy policy promise no internet access; keep that true
      - name: Check permissions
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          $AAPT2 dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The app now asks for INTERNET; update store/PRIVACY.md and the listing first"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch
          path: app/build/outputs/apk/release/app-release.apk
      # Pro unlocked, separate app; for testing on your own phone only, never upload it
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenSwitch-Test
          path: app/build/outputs/apk/unlocked/app-unlocked.apk
      # the .aab file is what Google Play accepts for upload
      - uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
